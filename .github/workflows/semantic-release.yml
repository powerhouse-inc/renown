name: Semantic Release

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main

env:
  GHCR_REGISTRY: ghcr.io
  VETRA_REGISTRY: cr.vetra.io
  VETRA_IMAGE: cr.vetra.io/renown/renown-app

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run lint

      - name: Semantic Release
        if: github.ref_name == 'main'
        run: |
          pnpx semantic-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Get latest version tag
        id: get_version
        if: github.ref_name == 'main'
        run: |
          git fetch --tags
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$VERSION" ]; then
            echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
            echo "Version: ${VERSION#v}"
          else
            echo "version=" >> $GITHUB_OUTPUT
            echo "No version tag found"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Vetra Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.VETRA_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Compute image tags
        id: tags
        run: |
          {
            echo "list<<EOF"
            if [ "${GITHUB_REF_NAME}" = "staging" ]; then
              echo "${GHCR_REGISTRY}/${GITHUB_REPOSITORY}:staging"
              echo "${VETRA_IMAGE}:staging"
              echo "${VETRA_IMAGE}:staging-${GITHUB_SHA::7}"
            else
              echo "${GHCR_REGISTRY}/${GITHUB_REPOSITORY}:latest"
              echo "${GHCR_REGISTRY}/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
              echo "${VETRA_IMAGE}:latest"
              echo "${VETRA_IMAGE}:${GITHUB_REF_NAME}"
              VERSION="${{ steps.get_version.outputs.version }}"
              if [ -n "$VERSION" ]; then
                echo "${GHCR_REGISTRY}/${GITHUB_REPOSITORY}:${VERSION}"
                echo "${VETRA_IMAGE}:${VERSION}"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TAG=${{ steps.get_version.outputs.version || github.ref_name }}
            NEXT_PUBLIC_OPENPANEL_CLIENT_ID=7496b8b9-281d-40c7-af8e-541aaa228af8
            NEXT_PUBLIC_OPENPANEL_API_URL=https://openpanel.monitoring.vetra.io/api
