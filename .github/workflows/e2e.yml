name: E2E

# The layout guards, the wallet/account specs and the organisation specs, in a real browser. The
# Playwright config starts the stub switchboard and the dev server itself
# (webServer, with NEXT_PUBLIC_E2E_AUTH=1 and the stub endpoint), and with
# CI set it never reuses a running server and retries a failed test twice.

on:
  push:
    branches:
      - main
      - deploy/staging
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e specs
        run: >-
          pnpm exec playwright test
          e2e/layout-invariants-guards.spec.ts
          e2e/layout-invariants.spec.ts
          e2e/wallet-split.spec.ts
          e2e/account-switch.spec.ts
          e2e/org-client.spec.ts
          e2e/org-write.spec.ts
          e2e/org-page.spec.ts
          e2e/orgs-directory.spec.ts
          e2e/org-join.spec.ts
          e2e/org-manage-members.spec.ts
          e2e/org-manage-teams-settings.spec.ts
          e2e/org-account.spec.ts
          e2e/org-security-client.spec.ts
          e2e/org-manage-apps.spec.ts
          e2e/org-manage-security.spec.ts
          e2e/org-manage-integrations.spec.ts
          e2e/org-manage-oidc-audit.spec.ts
          e2e/app-provenance.spec.ts
          e2e/verify-orgs.spec.ts
          e2e/org-reports.spec.ts
          --workers=2

      # Always uploaded: the layout cases attach a full-page screenshot each (the gallery).
      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
